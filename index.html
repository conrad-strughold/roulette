<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roulette Tap Lab</title>
<style>
:root{font-family:system-ui,sans-serif;color:#ecf5ef;background:#091614}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 20%,#183a34,#091614 70%)}main{width:min(100%,480px);text-align:center}h1{font-size:2rem;margin:0}p{color:#a8c1b6}.wheel{position:relative;aspect-ratio:1;border:12px solid #875e28;border-radius:50%;margin:24px auto;box-shadow:0 0 0 5px #24170c,0 20px 60px #0009;overflow:hidden}.disc{position:absolute;inset:0;border-radius:50%;transition:transform .4s ease-out}.disc svg{width:100%;height:100%}.pointer{position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:26px solid #ffdb8e;z-index:2}.hub{position:absolute;inset:38%;background:radial-gradient(circle,#e8bf73,#6b481d);border:5px solid #392710;border-radius:50%;box-shadow:0 3px 8px #0009}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.stat{background:#172c28;border:1px solid #2f5046;border-radius:12px;padding:13px 4px}.stat b{display:block;font-size:1.35rem;color:#ffe0a2}.stat small{color:#a8c1b6}button{border:0;border-radius:14px;padding:17px 24px;font-weight:800;font-size:1.1rem;cursor:pointer}#tap{width:100%;background:#f5c96f;color:#19231b;touch-action:manipulation}#reset{margin-top:10px;background:#26443a;color:white;width:100%}.notice{font-size:.78rem;line-height:1.5}
</style>
<main><h1>ROULETTE TAP LAB</h1><p>Three wheel passes. Four ball passes. Track the slowdown.</p><div class="wheel"><div class="disc" id="disc"></div><div class="hub"></div><div class="pointer"></div></div><div class="stats"><div class="stat"><b id="taps">0/7</b><small>Recorded</small></div><div class="stat"><b id="rpm">—</b><small>Wheel RPM</small></div><div class="stat"><b id="ballrpm">—</b><small>Ball RPM</small></div></div><button id="tap">TAP: WHEEL PASS #1</button><button id="reset">RESET</button><p id="message">Tap whenever the zero pocket crosses a fixed marker. Then tap each time the ball crosses that marker.</p><section id="result" style="background:#172c28;border:1px solid #4d795e;border-radius:18px;padding:16px;margin-top:14px"><div style="color:#a8c1b6">TWO DOZENS TO PLAY</div><div id="dozens" style="font-size:1.35rem;font-weight:800;margin-top:7px">—</div></section></main>
<script>
const order=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];let taps=[],angle=0;
const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 400 400');
order.forEach((n,i)=>{const a=i*360/37-90,b=(i+1)*360/37-90,rad=x=>x*Math.PI/180;const p=(r,d)=>[200+r*Math.cos(rad(d)),200+r*Math.sin(rad(d))];const [x1,y1]=p(198,a),[x2,y2]=p(198,b),[x3,y3]=p(145,b),[x4,y4]=p(145,a);let path=document.createElementNS(svg.namespaceURI,'path');path.setAttribute('d',`M${x1} ${y1} A198 198 0 0 1 ${x2} ${y2} L${x3} ${y3} A145 145 0 0 0 ${x4} ${y4} Z`);path.setAttribute('fill',n===0?'#26764d':i%2?'#111b19':'#b43e3d');path.setAttribute('stroke','#e8c77f');path.setAttribute('stroke-width','1');svg.appendChild(path);const [tx,ty]=p(171,(a+b)/2);let text=document.createElementNS(svg.namespaceURI,'text');text.setAttribute('x',tx);text.setAttribute('y',ty);text.setAttribute('fill','#fff');text.setAttribute('font-size','15');text.setAttribute('font-weight','bold');text.setAttribute('text-anchor','middle');text.setAttribute('dominant-baseline','middle');text.setAttribute('transform',`rotate(${(a+b)/2+90} ${tx} ${ty})`);text.textContent=n;svg.appendChild(text)});document.getElementById('disc').appendChild(svg);
let completedRounds=Number(sessionStorage.getItem('rouletteCompletedRounds')||0);
function prankAudio(){
 try{
 const ctx=new (window.AudioContext||window.webkitAudioContext)();ctx.resume();
 const now=ctx.currentTime;
 for(let i=0;i<9;i++){const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=i%2?'sawtooth':'square';osc.frequency.setValueAtTime(220+i*47,now+i*.19);osc.frequency.exponentialRampToValueAtTime(95+i*12,now+i*.19+.16);gain.gain.setValueAtTime(.0001,now+i*.19);gain.gain.exponentialRampToValueAtTime(.6,now+i*.19+.015);gain.gain.exponentialRampToValueAtTime(.0001,now+i*.19+.18);osc.connect(gain).connect(ctx.destination);osc.start(now+i*.19);osc.stop(now+i*.19+.19)}setTimeout(()=>ctx.close(),3500);
 }catch(e){}
 if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('I LOVE KISSING BOYS!');u.volume=1;u.rate=.83;u.pitch=1.6;speechSynthesis.speak(u)}
}
const marks=[];const steps=['WHEEL PASS #1','WHEEL PASS #2','WHEEL PASS #3','BALL PASS #1','BALL PASS #2','BALL PASS #3','BALL PASS #4'];const tapBtn=document.getElementById('tap');const $=id=>document.getElementById(id);
function reset(){marks.length=0;$('taps').textContent='0/7';$('rpm').textContent='—';$('ballrpm').textContent='—';$('dozens').textContent='—';tapBtn.disabled=false;tapBtn.textContent='TAP: '+steps[0];$('message').textContent='Tap whenever the zero pocket crosses a fixed marker. Then tap each time the ball crosses that marker.';angle=0;$('disc').style.transform='rotate(0deg)'}
tapBtn.onclick=()=>{const now=performance.now(),n=marks.length;if(n&&((n<3&&now-marks[n-1]<250)||(n>3&&now-marks[n-1]<250)))return;marks.push(now);const count=marks.length;$('taps').textContent=count+'/7';if(count===3){const period=(marks[2]-marks[0])/2;$('rpm').textContent=(60000/period).toFixed(1);$('message').textContent='Now tap four consecutive passes of the ball at the same marker.'}if(count<7){tapBtn.textContent='TAP: '+steps[count];return}
const wheelPeriod=(marks[2]-marks[0])/2;const ballPeriods=[marks[4]-marks[3],marks[5]-marks[4],marks[6]-marks[5]];const ballPeriod=ballPeriods[2];const wheelRPM=60000/wheelPeriod,ballRPM=60000/ballPeriod;$('ballrpm').textContent=ballRPM.toFixed(1);
const slowdown=(ballPeriods[2]-ballPeriods[0])/2;const forecastPeriod=Math.max(250,ballPeriod+slowdown*1.5);const horizon=forecastPeriod*1.5;const wheelTurns=(marks[6]-marks[2]+horizon)/wheelPeriod;const ballTurns=1.5;const phase=(((-ballTurns-wheelTurns)*360)%360+360)%360;
const index=Math.floor(phase/360*37)%37;const number=order[index];const centerDozen=number===0?Math.floor(phase/120):Math.floor((number-1)/12);const neighbor=(centerDozen+(slowdown>=0?1:2))%3;const picks=[centerDozen,neighbor].sort((a,b)=>a-b);const names=['1–12','13–24','25–36'];$('dozens').textContent=picks.map(i=>names[i]).join(' + ');
angle+=phase;$('disc').style.transform='rotate('+angle+'deg)';$('message').textContent='Ball trend: '+(slowdown>=0?'slowing':'speeding up')+' · modeled from three ball intervals.';tapBtn.textContent='MEASUREMENT COMPLETE';tapBtn.disabled=true;completedRounds++;sessionStorage.setItem('rouletteCompletedRounds',completedRounds);if(completedRounds===7){prankAudio();$('message').textContent='JACKPOT! EVERYBODY LOOK AT ME!'}};
$('reset').onclick=reset;
</script></html>

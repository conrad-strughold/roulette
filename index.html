<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roulette Tap Lab</title>
<style>
:root{font-family:system-ui,sans-serif;color:#ecf5ef;background:#091614}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 20%,#183a34,#091614 70%)}main{width:min(100%,480px);text-align:center}h1{font-size:2rem;margin:0}p{color:#a8c1b6}.wheel{position:relative;aspect-ratio:1;border:12px solid #875e28;border-radius:50%;margin:24px auto;box-shadow:0 0 0 5px #24170c,0 20px 60px #0009;overflow:hidden}.disc{position:absolute;inset:0;border-radius:50%;transition:transform .4s ease-out}.disc svg{width:100%;height:100%}.pointer{position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:26px solid #ffdb8e;z-index:2}.hub{position:absolute;inset:38%;background:radial-gradient(circle,#e8bf73,#6b481d);border:5px solid #392710;border-radius:50%;box-shadow:0 3px 8px #0009}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.stat{background:#172c28;border:1px solid #2f5046;border-radius:12px;padding:13px 4px}.stat b{display:block;font-size:1.35rem;color:#ffe0a2}.stat small{color:#a8c1b6}button{border:0;border-radius:14px;padding:17px 24px;font-weight:800;font-size:1.1rem;cursor:pointer}#tap{width:100%;background:#f5c96f;color:#19231b;touch-action:manipulation}#reset{margin-top:10px;background:#26443a;color:white;width:100%}.notice{font-size:.78rem;line-height:1.5}
</style>
<main><h1>ROULETTE TAP LAB</h1><p>Tap each time the wheel completes a revolution.</p><div class="wheel"><div class="disc" id="disc"></div><div class="hub"></div><div class="pointer"></div></div><div class="stats"><div class="stat"><b id="taps">0</b><small>Taps</small></div><div class="stat"><b id="rpm">—</b><small>RPM estimate</small></div><div class="stat"><b id="guess">—</b><small>Fantasy pocket</small></div></div><button id="tap">TAP ON EACH REVOLUTION</button><button id="reset">RESET</button><p id="message">Three or more taps to generate a prediction.</p><p class="notice">Entertainment-only simulator. Tap timing cannot reliably predict a roulette outcome. No wagering advice.</p></main>
<script>
const order=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];let taps=[],angle=0;
const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 400 400');
order.forEach((n,i)=>{const a=i*360/37-90,b=(i+1)*360/37-90,rad=x=>x*Math.PI/180;const p=(r,d)=>[200+r*Math.cos(rad(d)),200+r*Math.sin(rad(d))];const [x1,y1]=p(198,a),[x2,y2]=p(198,b),[x3,y3]=p(145,b),[x4,y4]=p(145,a);let path=document.createElementNS(svg.namespaceURI,'path');path.setAttribute('d',`M${x1} ${y1} A198 198 0 0 1 ${x2} ${y2} L${x3} ${y3} A145 145 0 0 0 ${x4} ${y4} Z`);path.setAttribute('fill',n===0?'#26764d':i%2?'#111b19':'#b43e3d');path.setAttribute('stroke','#e8c77f');path.setAttribute('stroke-width','1');svg.appendChild(path);const [tx,ty]=p(171,(a+b)/2);let text=document.createElementNS(svg.namespaceURI,'text');text.setAttribute('x',tx);text.setAttribute('y',ty);text.setAttribute('fill','#fff');text.setAttribute('font-size','15');text.setAttribute('font-weight','bold');text.setAttribute('text-anchor','middle');text.setAttribute('dominant-baseline','middle');text.setAttribute('transform',`rotate(${(a+b)/2+90} ${tx} ${ty})`);text.textContent=n;svg.appendChild(text)});document.getElementById('disc').appendChild(svg);
document.getElementById('tap').onclick=()=>{const now=performance.now();if(taps.length&&now-taps.at(-1)<250)return;taps.push(now);document.getElementById('taps').textContent=taps.length;if(taps.length>=2){const gaps=taps.slice(1).map((t,i)=>t-taps[i]);const recent=gaps.slice(-4);const avg=recent.reduce((a,b)=>a+b,0)/recent.length;const rpm=60000/avg;document.getElementById('rpm').textContent=rpm.toFixed(1);angle+=360+360*(1000/avg);document.getElementById('disc').style.transform=`rotate(${angle}deg)`;if(taps.length>=3){const idx=Math.abs(Math.floor((avg*.037+rpm*1.9+taps.length*7)%37));document.getElementById('guess').textContent=order[idx];document.getElementById('message').textContent='Simulated landing: '+order[idx]+' · purely for fun.'}}};document.getElementById('reset').onclick=()=>{taps=[];angle=0;document.getElementById('disc').style.transform='rotate(0deg)';['taps','rpm','guess'].forEach((id,i)=>document.getElementById(id).textContent=i?'—':'0');document.getElementById('message').textContent='Three or more taps to generate a prediction.'};
</script></html>

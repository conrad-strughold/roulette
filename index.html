<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roulette Tap Lab</title>
<style>
:root{font-family:system-ui,sans-serif;color:#ecf5ef;background:#091614}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 20%,#183a34,#091614 70%)}main{width:min(100%,480px);text-align:center}h1{font-size:2rem;margin:0}p{color:#a8c1b6}.wheel{position:relative;aspect-ratio:1;border:12px solid #875e28;border-radius:50%;margin:24px auto;box-shadow:0 0 0 5px #24170c,0 20px 60px #0009;overflow:hidden}.disc{position:absolute;inset:0;border-radius:50%;transition:transform .4s ease-out}.disc svg{width:100%;height:100%}.pointer{position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:26px solid #ffdb8e;z-index:2}.hub{position:absolute;inset:38%;background:radial-gradient(circle,#e8bf73,#6b481d);border:5px solid #392710;border-radius:50%;box-shadow:0 3px 8px #0009}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.stat{background:#172c28;border:1px solid #2f5046;border-radius:12px;padding:13px 4px}.stat b{display:block;font-size:1.35rem;color:#ffe0a2}.stat small{color:#a8c1b6}button{border:0;border-radius:14px;padding:17px 24px;font-weight:800;font-size:1.1rem;cursor:pointer}#tap{width:100%;background:#f5c96f;color:#19231b;touch-action:manipulation}#reset{margin-top:10px;background:#26443a;color:white;width:100%}.notice{font-size:.78rem;line-height:1.5}
</style>
<main><h1>ROULETTE TAP LAB</h1><p>Two wheel revolutions. Two ball revolutions. One result.</p><div class="wheel"><div class="disc" id="disc"></div><div class="hub"></div><div class="pointer"></div></div><div class="stats"><div class="stat"><b id="taps">0/4</b><small>Recorded</small></div><div class="stat"><b id="rpm">—</b><small>Wheel RPM</small></div><div class="stat"><b id="ballrpm">—</b><small>Ball RPM</small></div></div><button id="tap">TAP: WHEEL PASS #1</button><button id="reset">RESET</button><p id="message">Watch a fixed marker. Tap each time the same wheel pocket passes it.</p><section id="result" style="background:#172c28;border:1px solid #4d795e;border-radius:18px;padding:16px;margin-top:14px"><div style="color:#a8c1b6">PREDICTED POCKET</div><div id="guess" style="font-size:3rem;font-weight:900;color:#ffe0a2">—</div><div style="color:#a8c1b6">TWO DOZENS TO COVER</div><div id="dozens" style="font-size:1.35rem;font-weight:800;margin-top:7px">—</div></section></main>
<script>
const order=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];let taps=[],angle=0;
const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 400 400');
order.forEach((n,i)=>{const a=i*360/37-90,b=(i+1)*360/37-90,rad=x=>x*Math.PI/180;const p=(r,d)=>[200+r*Math.cos(rad(d)),200+r*Math.sin(rad(d))];const [x1,y1]=p(198,a),[x2,y2]=p(198,b),[x3,y3]=p(145,b),[x4,y4]=p(145,a);let path=document.createElementNS(svg.namespaceURI,'path');path.setAttribute('d',`M${x1} ${y1} A198 198 0 0 1 ${x2} ${y2} L${x3} ${y3} A145 145 0 0 0 ${x4} ${y4} Z`);path.setAttribute('fill',n===0?'#26764d':i%2?'#111b19':'#b43e3d');path.setAttribute('stroke','#e8c77f');path.setAttribute('stroke-width','1');svg.appendChild(path);const [tx,ty]=p(171,(a+b)/2);let text=document.createElementNS(svg.namespaceURI,'text');text.setAttribute('x',tx);text.setAttribute('y',ty);text.setAttribute('fill','#fff');text.setAttribute('font-size','15');text.setAttribute('font-weight','bold');text.setAttribute('text-anchor','middle');text.setAttribute('dominant-baseline','middle');text.setAttribute('transform',`rotate(${(a+b)/2+90} ${tx} ${ty})`);text.textContent=n;svg.appendChild(text)});document.getElementById('disc').appendChild(svg);
const marks=[];const steps=['WHEEL PASS #1','WHEEL PASS #2','BALL PASS #1','BALL PASS #2'];const tapBtn=document.getElementById('tap');
function reset(){marks.length=0;document.getElementById('taps').textContent='0/4';document.getElementById('rpm').textContent='—';document.getElementById('ballrpm').textContent='—';document.getElementById('guess').textContent='—';document.getElementById('dozens').textContent='—';tapBtn.disabled=false;tapBtn.textContent='TAP: '+steps[0];document.getElementById('message').textContent='Watch a fixed marker. Tap each time the same wheel pocket passes it.';angle=0;document.getElementById('disc').style.transform='rotate(0deg)'}
tapBtn.onclick=()=>{const now=performance.now();if(marks.length===1&&now-marks[0]<250)return;if(marks.length===3&&now-marks[2]<250)return;marks.push(now);const n=marks.length;document.getElementById('taps').textContent=n+'/4';if(n===2){const w=60000/(marks[1]-marks[0]);document.getElementById('rpm').textContent=w.toFixed(1);document.getElementById('message').textContent='Now follow the ball and tap when it passes the same fixed marker twice.'}if(n<4){tapBtn.textContent='TAP: '+steps[n];return}
const wheelPeriod=marks[1]-marks[0],ballPeriod=marks[3]-marks[2];const wheelRPM=60000/wheelPeriod,ballRPM=60000/ballPeriod;document.getElementById('ballrpm').textContent=ballRPM.toFixed(1);
const direction=-1;const elapsed=marks[3]-marks[1];const wheelPhase=(elapsed/wheelPeriod)*360;const ballPhase=direction*360;const imaginedDrift=(ballRPM-wheelRPM)*0.73;const phase=((ballPhase-wheelPhase+imaginedDrift)%360+360)%360;const index=Math.floor(phase/360*37)%37;const number=order[index];document.getElementById('guess').textContent=number;
const centerDozen=number===0?Math.floor(phase/120):Math.floor((number-1)/12);const adjacent=(centerDozen+(Math.sin(phase*Math.PI/180)>=0?1:2))%3;const picks=[centerDozen,adjacent].sort((a,b)=>a-b);const names=['1–12','13–24','25–36'];document.getElementById('dozens').textContent=picks.map(i=>names[i]).join(' + ');
angle+=phase;document.getElementById('disc').style.transform='rotate('+angle+'deg)';document.getElementById('message').textContent='Calculated from the recorded intervals and a simulated ball drift.';tapBtn.textContent='MEASUREMENT COMPLETE';tapBtn.disabled=true};
document.getElementById('reset').onclick=reset;
</script></html>
